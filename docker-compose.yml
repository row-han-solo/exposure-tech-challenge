services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      PORT: "8080"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
